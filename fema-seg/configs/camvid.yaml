# Reconstruction settings, NOT an author-released configuration.
seed: 42
device: cuda
output: runs/camvid
train_manifest: data/camvid/pseudo/manifest.jsonl
val_manifest: data/camvid/val/manifest.jsonl
subset: data/camvid/subset42.json
vegetation: [5]
model:
  classes: 11
  dims: [64, 128, 256, 512]
  depths: [2, 2, 4, 2]
  state: 16
  context_dim: 128
  context_depth: 12
  heads: 4
  bridges: [3, 6, 9, 12]
  strides: [8, 4, 2, 1]
  alpha: 0.10
  offset: 2.0
  backend: cuda
  frequency: true
  mgcr: true
  eaa: true
  sgdu: true
  scan_mode: parity
train:
  epochs: 160
  fine_epochs: 40
  warmup: 10
  batch: 4
  crop: [1024, 1024]
  lr: 0.0001
  min_lr: 0.000001
  amp: true

